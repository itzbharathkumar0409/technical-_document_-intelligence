[project]
name = "dociq-backend"
version = "0.1.0"
description = "Technical Document Intelligence & Q&A Platform - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "python-magic-bin>=0.4.14",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "slowapi>=0.1.9",
    "tiktoken>=0.7.0",
    # Document parsing
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "markdown>=3.6",
    # Embedding (local fallback)
    "sentence-transformers>=3.0.0",
    # OpenAI-compatible client
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
